
name: Build SFR Droid APP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


        
      - name: Generate Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          

      - name: Check project files
        run: |
          echo "=== PROJECT FILES ==="
          ls -la
          echo "=== GRADLE WRAPPER ==="
          ls -la gradlew gradle/wrapper 2>&1 || true

      - name: Build Debug APK with detailed log
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace --info assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfr-droid-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: sfr-droid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
